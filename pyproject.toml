[project]
name = "pitwall"
version = "0.2.0"
description = "PITWALL: 1v1 F1 opponent prediction + counter-strategy"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "streamlit", "plotly", "fastf1"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pitwall"]

[tool.setuptools.package-data]
pitwall = ["assets/*"]
